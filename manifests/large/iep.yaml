# Source: iep/templates/infra/ganache.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ganache
  labels:
    app.kubernetes.io/name: ganache
    app.kubernetes.io/component: blockchain
    app.kubernetes.io/part-of: iep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ganache
  template:
    metadata:
      labels:
        app: ganache
        app.kubernetes.io/name: ganache
        app.kubernetes.io/component: blockchain
        app.kubernetes.io/part-of: iep
    spec:
      containers:
        - name: ganache
          image: "trufflesuite/ganache-cli:latest"
          args:
            - --host=0.0.0.0
            - --port=8545
            - --gasLimit=1e+07
            - --accounts=10
            - --defaultBalanceEther=10000
          ports:
            - name: rpc
              containerPort: 8545
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "node -e \"const http=require('http');const r=http.request({hostname:'localhost',port:8545,method:'POST',headers:{'Content-Type':'application/json'}},res=>{process.exit(res.statusCode===200?0:1)});r.on('error',()=>process.exit(1));r.write(JSON.stringify({jsonrpc:'2.0',method:'eth_blockNumber',params:[],id:1}));r.end()\""
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            limits:
              cpu: 1000m
              memory: 768Mi
            requests:
              cpu: 50m
              memory: 192Mi

---
# Source: iep/templates/infra/mongo.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
  labels:
    app.kubernetes.io/name: mongo
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: iep
spec:
  replicas: 1
  strategy:
    type: Recreate # ReadWriteOnce PVC — see mysql.yaml
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
        app.kubernetes.io/name: mongo
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: iep
    spec:
      containers:
        - name: mongo
          image: "mongo:6"
          ports:
            - name: mongo
              containerPort: 27017
          volumeMounts:
            - name: data
              mountPath: /data/db
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 10
          resources:
            limits:
              cpu: 2000m
              memory: 6Gi
            requests:
              cpu: 500m
              memory: 2Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mongo-data

---
# Source: iep/templates/infra/mysql.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  labels:
    app.kubernetes.io/name: mysql
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: iep
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
        app.kubernetes.io/name: mysql
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: iep
    spec:
      containers:
        - name: mysql
          image: "mysql:8.0"
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: iep-secret
                  key: MYSQL_ROOT_PASSWORD
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: iep-config
                  key: MYSQL_DATABASE
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
          readinessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$MYSQL_ROOT_PASSWORD\""]
            initialDelaySeconds: 15
            periodSeconds: 5
          resources:
            limits:
              cpu: 2000m
              memory: 6Gi
            requests:
              cpu: 500m
              memory: 2Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mysql-data

