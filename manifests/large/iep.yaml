# Source: iep/templates/servicemonitor.yaml
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: iep-microservices
  labels:
    app.kubernetes.io/name: iep
    app.kubernetes.io/component: servicemonitor
    app.kubernetes.io/part-of: iep
spec:
  selector:
    matchLabels:
      app.kubernetes.io/part-of: iep
      app.kubernetes.io/component: microservice
  namespaceSelector:
    matchNames:
      - iep
  endpoints:
    # By port NAME, not number. The three services listen on 5000, 5001 and
    # 5002, and all three name that port `http`.
    - port: http
      path: "/metrics"
      interval: "30s"
      scrapeTimeout: "10s"
