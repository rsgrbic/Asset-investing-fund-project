---
# Source: iep/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: iep-config
  labels:
    app.kubernetes.io/name: iep-config
    app.kubernetes.io/component: config
    app.kubernetes.io/part-of: iep
data:
  EMPLOYEE_ROLE: "employee"
  DIRECTOR_ROLE: "director"
  VOTING_DEADLINE_SECONDS: "3600"
  MYSQL_DATABASE: "iep_auth"
  MONGO_URL: "mongodb://mongo:27017"
  REDIS_URL: "redis://redis:6379/0"
  GANACHE_URL: "http://ganache:8545"

---
# Source: iep/templates/dashboard.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: iep-dashboards
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/name: iep
    app.kubernetes.io/component: dashboard
    app.kubernetes.io/part-of: iep
data:
  iep-overview.json: |
    {
      "uid": "iep-overview",
      "title": "IEP - application",
      "tags": [
        "iep"
      ],
      "timezone": "browser",
      "editable": true,
      "graphTooltip": 0,
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "fiscalYearStartMonth": 0,
      "refresh": "30s",
      "schemaVersion": 42,
      "panels": [
        {
          "type": "timeseries",
          "targets": [
            {
              "expr": "round(sum by (outcome) (increase(iep_voting_outcome_total[5m])))",
              "instant": false,
              "legendFormat": "{{outcome}}",
              "range": true
            }
          ],
          "title": "Vote outcomes",
          "description": "How votes ended. timeout means the vote deadline passed with no Finalized event: the watcher polls an event filter inside a bare except, so a dropped web3 connection is swallowed and the order stays pending. filter_error means create_filter raised and the watcher never started at all.",
          "transparent": false,
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "repeatDirection": "h",
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true,
              "calcs": []
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "min": 0,
              "custom": {
                "fillOpacity": 20,
                "showPoints": "never",
                "stacking": {
                  "mode": "normal"
                }
              }
            },
            "overrides": []
          }
        },
        {
          "type": "timeseries",
          "targets": [
            {
              "expr": "iep_voting_threads_active",
              "instant": false,
              "legendFormat": "{{pod}}",
              "range": true
            }
          ],
          "title": "Vote watcher threads in flight",
          "description": "One thread per in-flight vote, all in ONE gunicorn worker. This is the constraint that pins director to replicaCount 1. Adding --workers would break every gauge on this dashboard.",
          "transparent": false,
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "repeatDirection": "h",
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true,
              "calcs": []
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "min": 0,
              "custom": {
                "fillOpacity": 8,
                "showPoints": "never",
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": []
          }
        },
        {
          "type": "timeseries",
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le) (rate(iep_voting_duration_seconds_bucket[30m])))",
              "instant": false,
              "legendFormat": "p95",
              "range": true
            },
            {
              "expr": "histogram_quantile(0.50, sum by (le) (rate(iep_voting_duration_seconds_bucket[30m])))",
              "instant": false,
              "legendFormat": "p50",
              "range": true
            }
          ],
          "title": "Vote duration",
          "description": "Deploy to Finalized. Buckets top out at 3600s because that is VOTING_DEADLINE_SECONDS. Nothing in the HTTP metrics can measure this.",
          "transparent": false,
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "repeatDirection": "h",
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true,
              "calcs": []
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "min": 0,
              "custom": {
                "fillOpacity": 8,
                "showPoints": "never",
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": []
          }
        },
        {
          "type": "timeseries",
          "targets": [
            {
              "expr": "iep_pending_orders",
              "instant": false,
              "legendFormat": "director (pending_order prefix)",
              "range": true
            },
            {
              "expr": "redis_db_keys{db=\"db0\"}",
              "instant": false,
              "legendFormat": "exporter (all keys in db0)",
              "range": true
            }
          ],
          "title": "Pending orders: app view vs Redis view",
          "description": "director counts keys matching the pending_order prefix. The exporter counts every key in db0. A persistent gap means something writes to Redis that director does not know about.",
          "transparent": false,
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 8
          },
          "repeatDirection": "h",
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true,
              "calcs": []
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "min": 0,
              "custom": {
                "fillOpacity": 8,
                "showPoints": "never",
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": []
          }
        },
        {
          "type": "timeseries",
          "targets": [
            {
              "expr": "sum by (job, backend) (rate(iep_db_operations_total[5m]))",
              "instant": false,
              "legendFormat": "{{job}} -\u003e {{backend}}",
              "range": true
            }
          ],
          "title": "Database calls per second",
          "description": "Which service drives which backend. Counts WIRE commands, not logical calls -- count_documents() sends aggregate, and scan_iter pages with several SCANs.",
          "transparent": false,
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 16
          },
          "repeatDirection": "h",
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true,
              "calcs": []
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "min": 0,
              "custom": {
                "fillOpacity": 20,
                "showPoints": "never",
                "stacking": {
                  "mode": "normal"
                }
              }
            },
            "overrides": []
          }
        },
        {
          "type": "timeseries",
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le, backend, operation) (rate(iep_db_operation_duration_seconds_bucket[5m])))",
              "instant": false,
              "legendFormat": "{{backend}} {{operation}}",
              "range": true
            }
          ],
          "title": "Database latency p95",
          "description": "Client-side wall time, so it includes network and serialisation. Server-side timing would read lower.",
          "transparent": false,
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 16
          },
          "repeatDirection": "h",
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true,
              "calcs": []
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "min": 0,
              "custom": {
                "fillOpacity": 8,
                "showPoints": "never",
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": []
          }
        },
        {
          "type": "timeseries",
          "targets": [
            {
              "expr": "round(sum by (result) (increase(iep_login_total[15m])))",
              "instant": false,
              "legendFormat": "{{result}}",
              "range": true
            }
          ],
          "title": "Login outcomes",
          "description": "unknown-user and wrong-password share the invalid_credentials label on purpose: splitting them would leak which addresses are registered.",
          "transparent": false,
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 24
          },
          "repeatDirection": "h",
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true,
              "calcs": []
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "min": 0,
              "custom": {
                "fillOpacity": 20,
                "showPoints": "never",
                "stacking": {
                  "mode": "normal"
                }
              }
            },
            "overrides": []
          }
        },
        {
          "type": "timeseries",
          "targets": [
            {
              "expr": "sum by (job) (rate(flask_http_request_total[5m]))",
              "instant": false,
              "legendFormat": "flask: {{job}}",
              "range": true
            },
            {
              "expr": "sum (rate(nginx_ingress_controller_requests[5m]))",
              "instant": false,
              "legendFormat": "nginx edge",
              "range": true
            }
          ],
          "title": "HTTP requests per second",
          "description": "nginx counts what arrived at the edge; Flask counts what each service served. The difference is traffic nginx rejected or served itself.",
          "transparent": false,
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 24
          },
          "repeatDirection": "h",
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true,
              "calcs": []
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "min": 0,
              "custom": {
                "fillOpacity": 8,
                "showPoints": "never",
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": []
          }
        }
      ],
      "templating": {},
      "annotations": {}
    }
    
  iep-redis.json: |
    {
      "uid": "iep-redis-sdk",
      "title": "IEP - Redis",
      "tags": [
        "iep"
      ],
      "timezone": "browser",
      "editable": true,
      "graphTooltip": 0,
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "fiscalYearStartMonth": 0,
      "refresh": "30s",
      "schemaVersion": 42,
      "panels": [
        {
          "type": "timeseries",
          "targets": [
            {
              "expr": "redis_memory_used_bytes",
              "instant": false,
              "legendFormat": "used",
              "range": true
            },
            {
              "expr": "redis_memory_max_bytes",
              "instant": false,
              "legendFormat": "maxmemory",
              "range": true
            }
          ],
          "title": "Memory used against the cap",
          "description": "used_memory is the allocator's accounting, not process RSS. maxmemory is enforced against THIS number, so this is the pair that decides when writes start failing.",
          "transparent": false,
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "repeatDirection": "h",
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true,
              "calcs": []
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "min": 0,
              "custom": {
                "fillOpacity": 8,
                "showPoints": "never",
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": []
          }
        },
        {
          "type": "timeseries",
          "targets": [
            {
              "expr": "redis_memory_used_bytes / redis_memory_max_bytes",
              "instant": false,
              "legendFormat": "used / maxmemory",
              "range": true
            }
          ],
          "title": "Memory as a fraction of the cap",
          "description": "The IepRedisMemoryHigh alert fires above 0.8. Policy is noeviction, so at 1.0 writes are refused with an error rather than keys being dropped.",
          "transparent": false,
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "repeatDirection": "h",
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true,
              "calcs": []
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "custom": {
                "fillOpacity": 8,
                "showPoints": "never",
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": []
          }
        },
        {
          "type": "timeseries",
          "targets": [
            {
              "expr": "redis_db_keys",
              "instant": false,
              "legendFormat": "{{db}}",
              "range": true
            }
          ],
          "title": "Keys per database",
          "description": "Redis has 16 databases by default; only db0 is used here. db0 should track iep_pending_orders on the application dashboard.",
          "transparent": false,
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "repeatDirection": "h",
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true,
              "calcs": []
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "min": 0,
              "custom": {
                "fillOpacity": 8,
                "showPoints": "never",
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": []
          }
        },
        {
          "type": "timeseries",
          "targets": [
            {
              "expr": "rate(redis_evicted_keys_total[5m])",
              "instant": false,
              "legendFormat": "evicted/s",
              "range": true
            },
            {
              "expr": "rate(redis_expired_keys_total[5m])",
              "instant": false,
              "legendFormat": "expired/s",
              "range": true
            }
          ],
          "title": "Evicted and expired keys",
          "description": "Evicted MUST stay flat at zero. maxmemory-policy is noeviction, so any eviction at all means the policy is not what this chart thinks it is -- and a dropped key is a lost order.",
          "transparent": false,
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 8
          },
          "repeatDirection": "h",
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true,
              "calcs": []
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "min": 0,
              "custom": {
                "fillOpacity": 8,
                "showPoints": "never",
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": []
          }
        },
        {
          "type": "timeseries",
          "targets": [
            {
              "expr": "sum by (cmd) (rate(redis_commands_total[5m]))",
              "instant": false,
              "legendFormat": "{{cmd}}",
              "range": true
            }
          ],
          "title": "Commands per second",
          "description": "By command name. Includes the exporter's own INFO and director's scrape-time SCAN, so this never reaches zero.",
          "transparent": false,
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 16
          },
          "repeatDirection": "h",
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true,
              "calcs": []
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "min": 0,
              "custom": {
                "fillOpacity": 20,
                "showPoints": "never",
                "stacking": {
                  "mode": "normal"
                }
              }
            },
            "overrides": []
          }
        },
        {
          "type": "timeseries",
          "targets": [
            {
              "expr": "rate(redis_commands_duration_seconds_total[5m]) / rate(redis_commands_total[5m])",
              "instant": false,
              "legendFormat": "{{cmd}}",
              "range": true
            }
          ],
          "title": "Command latency, server side",
          "description": "Total command time divided by command count. Compare against iep_db_operation_duration_seconds on the application dashboard: the gap is network and client library time.",
          "transparent": false,
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 16
          },
          "repeatDirection": "h",
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true,
              "calcs": []
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "min": 0,
              "custom": {
                "fillOpacity": 8,
                "showPoints": "never",
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": []
          }
        },
        {
          "type": "timeseries",
          "targets": [
            {
              "expr": "redis_connected_clients",
              "instant": false,
              "legendFormat": "connected",
              "range": true
            },
            {
              "expr": "redis_blocked_clients",
              "instant": false,
              "legendFormat": "blocked",
              "range": true
            }
          ],
          "title": "Clients",
          "description": "blocked_clients above zero means someone is using a blocking command such as BLPOP. This codebase uses none, so it should stay flat.",
          "transparent": false,
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 24
          },
          "repeatDirection": "h",
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true,
              "calcs": []
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "min": 0,
              "custom": {
                "fillOpacity": 8,
                "showPoints": "never",
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": []
          }
        },
        {
          "type": "timeseries",
          "targets": [
            {
              "expr": "rate(redis_net_input_bytes_total[5m])",
              "instant": false,
              "legendFormat": "in",
              "range": true
            },
            {
              "expr": "rate(redis_net_output_bytes_total[5m])",
              "instant": false,
              "legendFormat": "out",
              "range": true
            }
          ],
          "title": "Network throughput",
          "description": "Useful mainly as a sanity check that traffic matches the command rate above.",
          "transparent": false,
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 24
          },
          "repeatDirection": "h",
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true,
              "calcs": []
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "Bps",
              "min": 0,
              "custom": {
                "fillOpacity": 8,
                "showPoints": "never",
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": []
          }
        }
      ],
      "templating": {},
      "annotations": {}
    }
    
