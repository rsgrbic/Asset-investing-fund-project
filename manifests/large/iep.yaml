      app: mysql
  template:
    metadata:
      labels:
        app: mysql
        app.kubernetes.io/name: mysql
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: iep
    spec:
      containers:
        - name: mysql
          image: "mysql:8.0"
          ports:
