apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: iep
  labels:
    app.kubernetes.io/name: iep
    app.kubernetes.io/component: ingress
    app.kubernetes.io/part-of: iep
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt"
    nginx.ingress.kubernetes.io/proxy-body-size: 2m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
spec:
  ingressClassName: "nginx"
  tls:
    - hosts:
        - "auth.20.215.32.142.sslip.io"
        - "director.20.215.32.142.sslip.io"
        - "employee.20.215.32.142.sslip.io"
      secretName: iep-tls
  rules:
    - host: "auth.20.215.32.142.sslip.io"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: auth
                port:
                  name: http
    - host: "director.20.215.32.142.sslip.io"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: director
                port:
                  name: http
    - host: "employee.20.215.32.142.sslip.io"
