apiVersion: v2
name: iep
description: IEP investment-fund microservices (auth, employee, director) with in-cluster MySQL, MongoDB, Redis and Ganache.
type: application

# version = the version of THIS CHART. Bump it on every chart change.
version: 1.1.0

# appVersion = the version of the APPLICATION. Informational only — image tags
# are full strings in values, so nothing derives from this.
appVersion: "1.0.0"

# ---------------------------------------------------------------------------
# Cluster add-ons ship WITH this chart, so `helm install` produces a working,
# reachable deployment in one command.
#
# ONE-TIME setup, not something you run before every install:
#     helm dependency update ./helm/iep   <- when the list below changes;
#                                            re-resolves versions, rewrites Chart.lock
#     helm dependency build  ./helm/iep   <- fresh clone; installs exactly the
#                                            versions already in Chart.lock
# charts/ is gitignored (downloaded content); Chart.lock is committed.
#
# ingress-nginx is cluster-scoped shared infrastructure: it creates an
# IngressClass and ClusterRoles. Two releases of this chart in one cluster
# would collide. Set .enabled=false where a controller already exists.
#
# cert-manager was a dependency here and is now Application iep-cert-manager.
# It was disabled in every values file, so it never rendered. TLS on a cluster
# without ArgoCD needs cert-manager installed separately.
# ---------------------------------------------------------------------------
dependencies:
  # The ingress controller. Always on: without it the Ingress resource is inert.
  - name: ingress-nginx
    version: "4.15.x"
    repository: https://kubernetes.github.io/ingress-nginx
    condition: ingress-nginx.enabled

maintainers:
  - name: rsgrbic
