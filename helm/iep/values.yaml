# =============================================================================
# DEFAULTS = local (Docker Desktop). Helm always loads this file.
#
#   helm upgrade --install iep ./helm/iep -n iep --create-namespace \
#     -f secrets.local.yaml
#
# =============================================================================

registry: ""

services:
  auth:
    image:
      repository: iep-auth
      tag: latest
    replicaCount: 1
    port: 5000
    host: auth.iep.local
    # HPA divides by cpu request; without one it shows <unknown>.
    resources:
      requests: { cpu: 50m, memory: 96Mi }
      limits: { cpu: 500m, memory: 384Mi }
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 4
      targetCPUUtilizationPercentage: 80

  employee:
    image:
      repository: iep-employee
      tag: latest
    replicaCount: 3
    port: 5001
    host: employee.iep.local
    resources:
      requests: { cpu: 50m, memory: 96Mi }
      limits: { cpu: 500m, memory: 384Mi }
    autoscaling:
      enabled: false
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilizationPercentage: 70

  director:
    image:
      repository: iep-director
      tag: latest
    # MUST STAY AT 1. The vote watcher thread lives in one Pod; with 2+
    # replicas a vote can finalise on a Pod with no listener.
    replicaCount: 1
    port: 5002
    host: director.iep.local
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { cpu: 500m, memory: 384Mi }
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 1
      targetCPUUtilizationPercentage: 80

# ---- ingress-nginx (subchart) ------------------------------------------------
ingress-nginx:
  enabled: true
  controller:
    replicaCount: 1
    service:
      type: LoadBalancer
    # Set false if the install hangs on "failed calling webhook".
    admissionWebhooks:
      enabled: true

# ---- cert-manager (subchart) -------------------------------------------------
# Off locally: Let's Encrypt validates over the public internet.
cert-manager:
  enabled: false
  crds:
    # Helm installs CRDs but never upgrades or deletes them.
    enabled: true

# ---- Ingress resource --------------------------------------------------------
ingress:
  enabled: true
  className: nginx

  # Empty = no TLS. Setting it makes the Ingress request a certificate.
  clusterIssuer: ""
  # Setting an email also creates the ClusterIssuer via clusterissuer.yaml.
  acmeEmail: ""
  # Swap for the staging URL to get untrusted certs under looser rate limits.
  acmeServer: https://acme-v02.api.letsencrypt.org/directory

  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 2m
    # director's contract deploy can exceed nginx's default 60s.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"

# ---- Prometheus scraping -----------------------------------------------------
# Off locally: ServiceMonitor CRDs do not exist without the operator.
monitoring:
  enabled: false
  # TODO: block /metrics at the ingress; it is currently public.
  path: /metrics
  interval: 30s
  # Must stay below interval.
  scrapeTimeout: 10s

  # Redis only; mongo/mysql exporters dropped as redundant with in-app counters.
  exporters:
    enabled: true
    redis:
      image: oliver006/redis_exporter:v1.89.0-alpine
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { cpu: 100m, memory: 128Mi }

env:
  EMPLOYEE_ROLE: employee
  DIRECTOR_ROLE: director
  VOTING_DEADLINE_SECONDS: "3600"
  MYSQL_DATABASE: iep_auth

# create: true renders iep-secret from values below (local only).
# create: false expects it to already exist (values-hosted.yaml).
secrets:
  create: true
  jwtSecretKey: "CHANGE_ME_dev_only"
  mysqlRootPassword: "CHANGE_ME_dev_only"
  sqlDatabaseUrl: "mysql+pymysql://root:CHANGE_ME_dev_only@mysql:3306/iep_auth?charset=utf8mb4"
  directorEmail: "director@example.com"
  directorForename: "Scrooge"
  directorSurname: "McDuck"
  directorPassword: "CHANGE_ME_dev_only"

# Single-Pod MySQL/Mongo/Redis with PVCs. No HA — fine here, not production.
infra:
  mysql:
    image: mysql:8.0
    storage: 4Gi
    storageClass: "" # empty = cluster default (hostpath on Docker Desktop)
    resources:
      requests: { cpu: 50m, memory: 384Mi }
      limits: { cpu: 1000m, memory: 1Gi }
  mongo:
    image: mongo:6
    storage: 4Gi
    storageClass: ""
    resources:
      requests: { cpu: 50m, memory: 192Mi }
      limits: { cpu: 1000m, memory: 768Mi }
  redis:
    image: redis:7-alpine
    # Half the container memory limit. Overridden per profile in scale/*.yaml.
    maxmemory: 128mb
    # noeviction: eviction would silently drop pending orders.
    maxmemoryPolicy: noeviction
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { cpu: 500m, memory: 256Mi }
  # In-memory chain; every restart wipes contracts and balances.
  ganache:
    enabled: true
    # Empty = cluster-only. Ganache has no authentication; do not expose
    # on a public cluster.
    host: ganache.iep.local
    image: trufflesuite/ganache-cli:latest
    defaultBalanceEther: 10000
    accounts: 10
    gasLimit: 10000000
    resources:
      requests: { cpu: 50m, memory: 192Mi }
      limits: { cpu: 1000m, memory: 768Mi }
