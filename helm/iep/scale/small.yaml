# SCALE: SMALL — fits on a single 2-vCPU node.

services:
  auth:
    replicaCount: 1
    resources:
      requests: { cpu: 50m, memory: 96Mi }
      limits: { cpu: 250m, memory: 256Mi }
    autoscaling:
      enabled: false

  employee:
    replicaCount: 1
    resources:
      requests: { cpu: 50m, memory: 96Mi }
      limits: { cpu: 250m, memory: 256Mi }
    # The only autoscaled service. auth is low-volume, director cannot replicate.
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 70

  director:
    replicaCount: 1
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { cpu: 250m, memory: 256Mi }
    autoscaling:
      enabled: false

infra:
  mysql:
    storage: 4Gi
    resources:
      requests: { cpu: 50m, memory: 384Mi }
      limits: { cpu: 500m, memory: 1Gi }
  mongo:
    storage: 4Gi
    resources:
      requests: { cpu: 50m, memory: 192Mi }
      limits: { cpu: 500m, memory: 768Mi }
  redis:
    maxmemory: 128mb
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { cpu: 250m, memory: 256Mi }
