# SCALE: MEDIUM — first tier with autoscaling. Needs metrics-server or HPAs do nothing.

services:
  auth:
    replicaCount: 2
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 500m, memory: 512Mi }
    autoscaling:
      enabled: false

  employee:
    replicaCount: 2
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 500m, memory: 512Mi }
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 5
      targetCPUUtilizationPercentage: 70

  director:
    # Still 1 — the in-memory vote listener cannot be replicated.
    replicaCount: 1
    resources:
      requests: { cpu: 150m, memory: 192Mi }
      limits: { cpu: 750m, memory: 512Mi }
    autoscaling:
      enabled: false

infra:
  mysql:
    storage: 16Gi
    resources:
      requests: { cpu: 200m, memory: 768Mi }
      limits: { cpu: 1000m, memory: 2Gi }
  mongo:
    storage: 16Gi
    resources:
      requests: { cpu: 200m, memory: 768Mi }
      limits: { cpu: 1000m, memory: 2Gi }
  redis:
    maxmemory: 256mb
    storage: 4Gi
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 500m, memory: 512Mi }
