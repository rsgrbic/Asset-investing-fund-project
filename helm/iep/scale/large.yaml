# SCALE: LARGE — multi-node cluster, hundreds of users.
#
# director stays at 1: its in-memory vote listener cannot be replicated.
# At this scale that is a hard ceiling. The fix is architectural — extract the
# listener into a separate worker that consumes from Redis.

services:
  auth:
    replicaCount: 2
    resources:
      requests: { cpu: 200m, memory: 256Mi }
      limits: { cpu: 1000m, memory: 1Gi }
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilizationPercentage: 65

  employee:
    replicaCount: 3
    resources:
      requests: { cpu: 200m, memory: 256Mi }
      limits: { cpu: 1000m, memory: 1Gi }
    autoscaling:
      enabled: true
      minReplicas: 3
      maxReplicas: 12
      # Lower than medium: leave headroom while cluster autoscaler adds a node.
      targetCPUUtilizationPercentage: 60

  director:
    # Cannot go above 1; vertical scaling only.
    replicaCount: 1
    resources:
      requests: { cpu: 300m, memory: 384Mi }
      limits: { cpu: 1500m, memory: 1Gi }
    autoscaling:
      enabled: false

infra:
  # Single-Pod databases do not scale here; migrate to Azure managed services.
  # Sizes below keep it runnable in the meantime.
  mysql:
    storage: 64Gi
    resources:
      requests: { cpu: 500m, memory: 2Gi }
      limits: { cpu: 2000m, memory: 6Gi }
  mongo:
    storage: 64Gi
    resources:
      requests: { cpu: 500m, memory: 2Gi }
      limits: { cpu: 2000m, memory: 6Gi }
  redis:
    maxmemory: 1024mb
    storage: 16Gi
    resources:
      requests: { cpu: 250m, memory: 512Mi }
      limits: { cpu: 1000m, memory: 2Gi }
