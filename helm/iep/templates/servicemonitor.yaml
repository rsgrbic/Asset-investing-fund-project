{{/* Gated by monitoring.enabled; requires Prometheus Operator CRDs from wave -1. */}}
{{- if .Values.monitoring.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: iep-microservices
  labels:
    app.kubernetes.io/name: iep
    app.kubernetes.io/component: servicemonitor
    app.kubernetes.io/part-of: iep
spec:
  selector:
    matchLabels:
      app.kubernetes.io/part-of: iep
      app.kubernetes.io/component: microservice
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  endpoints:
    - port: http
      path: {{ .Values.monitoring.path | quote }}
      interval: {{ .Values.monitoring.interval | quote }}
      scrapeTimeout: {{ .Values.monitoring.scrapeTimeout | quote }}
{{- if .Values.monitoring.exporters.enabled }}
---
{{/* Exporters use port `metrics`, not `http`. */}}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: iep-exporters
  labels:
    app.kubernetes.io/name: iep
    app.kubernetes.io/component: servicemonitor
    app.kubernetes.io/part-of: iep
spec:
  selector:
    matchLabels:
      app.kubernetes.io/part-of: iep
      app.kubernetes.io/component: exporter
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.monitoring.interval | quote }}
      scrapeTimeout: {{ .Values.monitoring.scrapeTimeout | quote }}
{{- end }}
{{- end }}
