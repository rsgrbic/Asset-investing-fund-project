{{/*
One Ingress, host-based routing. Misspelled annotations are silently ignored.
TODO: block /metrics at the ingress; it is currently public.
*/}}
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: iep
  labels:
    app.kubernetes.io/name: iep
    app.kubernetes.io/component: ingress
    app.kubernetes.io/part-of: iep
  annotations:
    {{- if .Values.ingress.clusterIssuer }}
    cert-manager.io/cluster-issuer: {{ .Values.ingress.clusterIssuer | quote }}
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className | quote }}
  {{- if .Values.ingress.clusterIssuer }}
  {{- /* One cert with all hostnames as SANs; cert-manager fills it in. */}}
  tls:
    - hosts:
        {{- range $name, $svc := .Values.services }}
        - {{ $svc.host | quote }}
        {{- end }}
        {{- if and .Values.infra.ganache.enabled .Values.infra.ganache.host }}
        - {{ .Values.infra.ganache.host | quote }}
        {{- end }}
      secretName: iep-tls
  {{- end }}
  rules:
    {{- range $name, $svc := .Values.services }}
    - host: {{ $svc.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $name }}
                port:
                  name: http
    {{- end }}
    {{- /* Ganache is under .Values.infra; only routed when host is set. */}}
    {{- if and .Values.infra.ganache.enabled .Values.infra.ganache.host }}
    - host: {{ .Values.infra.ganache.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ganache
                port:
                  name: rpc
    {{- end }}
{{- end }}
