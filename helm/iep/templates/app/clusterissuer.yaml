{{/*
A ClusterIssuer tells cert-manager WHERE to get certificates from. It is not
part of the cert-manager chart — that chart installs the controller and CRDs;
the issuer is your configuration and has to be created separately, which is
what this file does.

"Cluster" issuer, not "Issuer": cluster-scoped, so it can serve any namespace.

Rendered only when both a name and an email are set. Let's Encrypt requires
the email for expiry notices; the account key is generated by cert-manager and
stored in privateKeySecretRef.

FIRST-INSTALL ORDERING TRAP
  cert-manager v1.21 ships its CRDs as ordinary templates rather than in a
  crds/ directory, and Helm does not wait for template-rendered CRDs to become
  Established. So on a brand-new cluster this resource can be submitted before
  the API server knows what a ClusterIssuer is:

      no matches for kind "ClusterIssuer" in version "cert-manager.io/v1"

  Fix: install once with ingress.clusterIssuer="" so cert-manager and its CRDs
  land, then re-run with the issuer set. Two commands, once per cluster.

The HTTP-01 solver proves you control the hostname: Let's Encrypt requests
http://<host>/.well-known/acme-challenge/<token> and cert-manager answers it
through a temporary Ingress on the same class. That request comes FROM THE
PUBLIC INTERNET, which is why none of this can work against *.iep.local.
*/}}
{{- if and .Values.ingress.clusterIssuer .Values.ingress.acmeEmail }}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.ingress.clusterIssuer }}
  labels:
    app.kubernetes.io/name: {{ .Values.ingress.clusterIssuer }}
    app.kubernetes.io/component: tls
    app.kubernetes.io/part-of: iep
spec:
  acme:
    server: {{ .Values.ingress.acmeServer | quote }}
    email: {{ .Values.ingress.acmeEmail | quote }}
    privateKeySecretRef:
      name: {{ .Values.ingress.clusterIssuer }}-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: {{ .Values.ingress.className | quote }}
{{- end }}
