{{/*
On first install, cert-manager CRDs may not be Established yet.
Fix: install once with clusterIssuer="" then re-run with it set.
*/}}
{{- if and .Values.ingress.clusterIssuer .Values.ingress.acmeEmail }}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.ingress.clusterIssuer }}
  labels:
    app.kubernetes.io/name: {{ .Values.ingress.clusterIssuer }}
    app.kubernetes.io/component: tls
    app.kubernetes.io/part-of: iep
spec:
  acme:
    server: {{ .Values.ingress.acmeServer | quote }}
    email: {{ .Values.ingress.acmeEmail | quote }}
    privateKeySecretRef:
      name: {{ .Values.ingress.clusterIssuer }}-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: {{ .Values.ingress.className | quote }}
{{- end }}
