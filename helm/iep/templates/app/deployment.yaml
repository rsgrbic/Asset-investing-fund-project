{{- range $name, $svc := .Values.services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/component: microservice
    app.kubernetes.io/part-of: iep
spec:
  {{- /* Omitted when HPA is active, or helm upgrade fights the autoscaler. */}}
  {{- if not $svc.autoscaling.enabled }}
  replicas: {{ $svc.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        app: {{ $name }}
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/component: microservice
        app.kubernetes.io/part-of: iep
      annotations:
        {{- /* ConfigMap/Secret changes do not restart Pods; the hash forces a roll. */}}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") $ | sha256sum }}
        {{- if $.Values.secrets.create }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") $ | sha256sum }}
        {{- end }}
    spec:
      containers:
        - name: {{ $name }}
          image: "{{ with $.Values.registry }}{{ trimSuffix "/" . }}/{{ end }}{{ $svc.image.repository }}:{{ $svc.image.tag }}"
          {{- /* Kubernetes defaults to Always for :latest, which pulls from Docker Hub. */}}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: {{ $svc.port }}
          envFrom:
            - configMapRef:
                name: iep-config
            - secretRef:
                name: iep-secret
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
{{- end }}
