{{/* Redis exporter. Connects as an ordinary client and reformats INFO/DBSIZE. */}}
{{- if and .Values.monitoring.enabled .Values.monitoring.exporters.enabled }}
{{- $ex := .Values.monitoring.exporters }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-exporter
  labels:
    app.kubernetes.io/name: redis-exporter
    app.kubernetes.io/component: exporter
    app.kubernetes.io/part-of: iep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-exporter
  revisionHistoryLimit: 3
  template:
    metadata:
      labels:
        app: redis-exporter
        app.kubernetes.io/name: redis-exporter
        app.kubernetes.io/component: exporter
        app.kubernetes.io/part-of: iep
    spec:
      containers:
        - name: exporter
          image: {{ $ex.redis.image | quote }}
          env:
            - name: REDIS_ADDR
              value: redis://redis:6379
          ports:
            - name: metrics
              containerPort: 9121
          readinessProbe:
            httpGet: { path: /metrics, port: metrics }
            periodSeconds: 10
          resources:
            {{- toYaml $ex.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: redis-exporter
  labels:
    app.kubernetes.io/name: redis-exporter
    app.kubernetes.io/component: exporter
    app.kubernetes.io/part-of: iep
spec:
  type: ClusterIP
  selector:
    app: redis-exporter
  ports:
    - name: metrics
      port: 9121
      targetPort: metrics
{{- end }}
