{{/*
In-memory Ethereum testnet for director's voting contract. ganache-cli runs
without --db, so every restart wipes deployed contracts and balances — hence
no PVC. Never exposed; ClusterIP only.
*/}}
{{- if .Values.infra.ganache.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ganache
  labels:
    app.kubernetes.io/name: ganache
    app.kubernetes.io/component: blockchain
    app.kubernetes.io/part-of: iep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ganache
  template:
    metadata:
      labels:
        app: ganache
        app.kubernetes.io/name: ganache
        app.kubernetes.io/component: blockchain
        app.kubernetes.io/part-of: iep
    spec:
      containers:
        - name: ganache
          image: {{ .Values.infra.ganache.image | quote }}
          args:
            - --host=0.0.0.0
            - --port=8545
            - --gasLimit={{ .Values.infra.ganache.gasLimit }}
            - --accounts={{ .Values.infra.ganache.accounts }}
            - --defaultBalanceEther={{ .Values.infra.ganache.defaultBalanceEther }}
          ports:
            - name: rpc
              containerPort: 8545
          {{- /* JSON-RPC has no GET health endpoint, so the probe posts a real
                 eth_blockNumber call and checks for 200. */}}
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "node -e \"const http=require('http');const r=http.request({hostname:'localhost',port:8545,method:'POST',headers:{'Content-Type':'application/json'}},res=>{process.exit(res.statusCode===200?0:1)});r.on('error',()=>process.exit(1));r.write(JSON.stringify({jsonrpc:'2.0',method:'eth_blockNumber',params:[],id:1}));r.end()\""
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            {{- toYaml .Values.infra.ganache.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: ganache
  labels:
    app.kubernetes.io/name: ganache
    app.kubernetes.io/component: blockchain
    app.kubernetes.io/part-of: iep
spec:
  type: ClusterIP
  selector:
    app: ganache
  ports:
    - name: rpc
      port: 8545
      targetPort: rpc
{{- end }}
