{{/*
helm uninstall deletes these PVCs and the data with them.
Prune=false stops ArgoCD doing the same when a render drops one. These hold the
only copy of the databases, so a wrong diff must not be able to delete them.
*/}}
{{- range $item := list "mysql" "mongo" }}
{{- with index $.Values.infra $item }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $item }}-data
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
  labels:
    app.kubernetes.io/name: {{ $item }}-data
    app.kubernetes.io/component: storage
    app.kubernetes.io/part-of: iep
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .storageClass }}
  storageClassName: {{ .storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .storage | quote }}
{{- end }}
{{- end }}
