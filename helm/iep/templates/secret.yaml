{{/* Rendered only when secrets.create is true; otherwise iep-secret must already exist. */}}
{{- if .Values.secrets.create }}
{{- /* Fail the render if placeholders were not overridden. */}}
{{- range $key := list "jwtSecretKey" "mysqlRootPassword" "sqlDatabaseUrl" "directorPassword" }}
{{- if contains "CHANGE_ME" (get $.Values.secrets $key | toString) }}
{{- fail (printf "secrets.%s is still a placeholder. Pass real values with -f secrets.local.yaml (see helm/secrets.local.yaml.example)." $key) }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: iep-secret
  labels:
    app.kubernetes.io/name: iep-secret
    app.kubernetes.io/component: config
    app.kubernetes.io/part-of: iep
type: Opaque
stringData:
  JWT_SECRET_KEY: {{ required "secrets.jwtSecretKey is required" .Values.secrets.jwtSecretKey | quote }}
  SQL_DATABASE_URL: {{ required "secrets.sqlDatabaseUrl is required" .Values.secrets.sqlDatabaseUrl | quote }}
  MYSQL_ROOT_PASSWORD: {{ required "secrets.mysqlRootPassword is required" .Values.secrets.mysqlRootPassword | quote }}
  DIRECTOR_EMAIL: {{ .Values.secrets.directorEmail | quote }}
  DIRECTOR_FORENAME: {{ .Values.secrets.directorForename | quote }}
  DIRECTOR_SURNAME: {{ .Values.secrets.directorSurname | quote }}
  DIRECTOR_PASSWORD: {{ required "secrets.directorPassword is required" .Values.secrets.directorPassword | quote }}
{{- end }}
