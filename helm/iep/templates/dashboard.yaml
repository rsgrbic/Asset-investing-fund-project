{{/*
Grafana dashboards, shipped as ConfigMaps.

A dashboard built in the Grafana UI lives in Grafana's own database inside the
pod. That pod has no volume, so a restart, a redeploy or a node migration
erases it. Shipping it here is what puts it in git and through the same CI and
deploy-branch path as everything else.

kube-prometheus-stack runs a sidecar next to Grafana that watches for
ConfigMaps labelled `grafana_dashboard: "1"`, and its searchNamespace is ALL,
so this object works from the iep namespace. No Grafana restart is needed.

The JSON lives in dashboards/, NOT under templates/. Helm never templates
files outside templates/, and .Files.Get returns them verbatim. That matters:
Grafana legend formats use {{ "{{outcome}}" }} syntax, which Helm would
otherwise try to evaluate and fail on.
*/}}
{{- if .Values.monitoring.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: iep-dashboards
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/name: iep
    app.kubernetes.io/component: dashboard
    app.kubernetes.io/part-of: iep
data:
{{- range $path, $_ := .Files.Glob "dashboards/*.json" }}
  {{ base $path }}: |
{{ $.Files.Get $path | indent 4 }}
{{- end }}
{{- end }}
