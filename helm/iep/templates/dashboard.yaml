{{/*
JSON lives in dashboards/, not templates/. .Files.Get returns it verbatim,
which avoids Helm trying to evaluate Grafana's {{ "{{outcome}}" }} legends.
The sidecar picks up ConfigMaps labelled grafana_dashboard: "1".
*/}}
{{- if .Values.monitoring.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: iep-dashboards
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/name: iep
    app.kubernetes.io/component: dashboard
    app.kubernetes.io/part-of: iep
data:
{{- range $path, $_ := .Files.Glob "dashboards/*.json" }}
  {{ base $path }}: |
{{ $.Files.Get $path | indent 4 }}
{{- end }}
{{- end }}
