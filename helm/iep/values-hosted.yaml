# =============================================================================
# HOSTED — the AKS cluster. Layered on top of values.yaml.
# Sizing lives in scale/*.yaml; only environment-specific keys belong here.
# =============================================================================

registry: "ghcr.io/rsgrbic"

# image.tag is set by CI at render time, never stored here.
services:
  auth:
    host: auth.20.215.32.142.sslip.io
    image:
      tag: SET-BY-CI
  employee:
    host: employee.20.215.32.142.sslip.io
    image:
      tag: SET-BY-CI
  director:
    host: director.20.215.32.142.sslip.io
    image:
      tag: SET-BY-CI

ingress-nginx:
  enabled: false
  controller:
    service:
      annotations:
        # Azure health probe hits /; ingress-nginx returns 404 without a Host.
        service.beta.kubernetes.io/azure-load-balancer-health-probe-request-path: /healthz
        # Pre-created static IP from iep-rg.
        service.beta.kubernetes.io/azure-pip-name: LBalancer_IP
        service.beta.kubernetes.io/azure-load-balancer-resource-group: iep-rg

cert-manager:
  enabled: false

monitoring:
  enabled: true

ingress:
  clusterIssuer: letsencrypt
  acmeEmail: "ga210363d@student.etf.bg.ac.rs"

infra:
  # Not routed publicly; no authentication.
  ganache:
    host: ""
  # Azure managed disks; minimum billable size is 4 GiB.
  mysql:
    storageClass: managed-csi
  mongo:
    storageClass: managed-csi

secrets:
  create: false
