# =============================================================================
# HOSTED — the AKS cluster. Layered on top of values.yaml.
#
#   helm upgrade --install iep ./helm/iep -n iep --create-namespace \
#     -f helm/iep/values-hosted.yaml -f helm/iep/scale/*.yaml
#
# ONLY environment-specific keys belong here — the things that are true because
# this is Azure. Sizing (replicas, resources, storage) lives in scale/, and
# anything set here would be silently overridden by it.
#
# =============================================================================

registry: "ghcr.io/rsgrbic"

# image.tag is rewritten by CI on every push to main — never :latest here, an
services:
  auth:
    host: auth.20.215.32.142.sslip.io
    image:
      tag: 6c0d3e889c9c6d43b9ee1a472a25d6ac40cba083
  employee:
    host: employee.20.215.32.142.sslip.io
    image:
      tag: 6c0d3e889c9c6d43b9ee1a472a25d6ac40cba083
  director:
    host: director.20.215.32.142.sslip.io
    image:
      tag: 6c0d3e889c9c6d43b9ee1a472a25d6ac40cba083

ingress-nginx:
  enabled: false
  controller:
    service:
      annotations:
        # Required, or nothing reaches the cluster. Azure probes the nodePort
        # with `GET /` and drops traffic to any node that does not answer
        # 2xx/3xx; ingress-nginx returns 404 there because a probe carries no
        # matching Host header. /healthz answers 200 regardless of Host.
        service.beta.kubernetes.io/azure-load-balancer-health-probe-request-path: /healthz
        # Attach the pre-created static IP from iep-rg instead of letting AKS
        # allocate (and later garbage-collect) one of its own.
        service.beta.kubernetes.io/azure-pip-name: LBalancer_IP
        service.beta.kubernetes.io/azure-load-balancer-resource-group: iep-rg

cert-manager:
  enabled: false

ingress:
  clusterIssuer: letsencrypt
  acmeEmail: "ga210363d@student.etf.bg.ac.rs"

infra:
  # Ganache has no authentication, so it is deliberately NOT routed here.
  # director still reaches it in-cluster at http://ganache:8545.
  ganache:
    host: ""
  # Azure managed disks instead of the local hostpath provisioner. Minimum
  # billable size is 4 GiB regardless of what is requested.
  mysql:
    storageClass: managed-csi
  mongo:
    storageClass: managed-csi
  redis:
    storageClass: managed-csi

# see helm/README.md
secrets:
  create: false
