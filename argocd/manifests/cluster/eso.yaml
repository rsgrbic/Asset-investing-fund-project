apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: azure-kv
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: https://iep-keyv.vault.azure.net
      serviceAccountRef:
        name: external-secrets
        namespace: external-secrets
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: iep-secret
  namespace: iep
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-kv
    kind: ClusterSecretStore
  target:
    name: iep-secret
    creationPolicy: Owner
  data:
    - secretKey: JWT_SECRET_KEY
      remoteRef: {key: jwt-secret-key}
    - secretKey: MYSQL_ROOT_PASSWORD
      remoteRef: {key: mysql-root-password}
    - secretKey: SQL_DATABASE_URL
      remoteRef: {key: sql-database-url}
    - secretKey: DIRECTOR_EMAIL
      remoteRef: {key: director-email}
    - secretKey: DIRECTOR_FORENAME
      remoteRef: {key: director-forename}
    - secretKey: DIRECTOR_SURNAME
      remoteRef: {key: director-surname}
    - secretKey: DIRECTOR_PASSWORD
      remoteRef: {key: director-password}
---
# Grafana's admin login. Without this the chart generates a random password into
# a Secret it owns, which is lost on every reinstall and is not recorded anywhere.
# The `monitoring` namespace must exist before this applies.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-kv
    kind: ClusterSecretStore
  target:
    name: grafana-admin
    creationPolicy: Owner
  data:
    - secretKey: admin-user
      remoteRef: {key: grafana-admin-user}
    - secretKey: admin-password
      remoteRef: {key: grafana-admin-password}