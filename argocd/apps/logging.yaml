# Loki (storage + query) and Alloy (collection). Loki collects nothing
# itself; Alloy pushes into it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: iep-loki
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki
    targetRevision: 7.3.0
    helm:
      values: |
        # Without this the Service is named after the release (iep-loki) and the hardcoded loki.monitoring.svc URLs do not resolve.
        fullnameOverride: loki
        # Chart defaults to distributed + object storage; override for single node.
        deploymentMode: SingleBinary
        loki:
          # Single tenant; without this every query needs X-Scope-OrgID.
          auth_enabled: false
          commonConfig:
            replication_factor: 1
          storage:
            type: filesystem
          # Required since chart 6.x; Loki refuses to start without it.
          schemaConfig:
            configs:
              - from: "2024-04-01"
                store: tsdb
                object_store: filesystem
                schema: v13
                index: { prefix: index_, period: 24h }
          limits_config:
            # 7 days, matching Prometheus retention.
            retention_period: 168h
          compactor:
            # Off by default; without it expired data is never deleted.
            retention_enabled: true
            delete_request_store: filesystem
        singleBinary:
          replicas: 1
          # Standard_E2ds_v4 allows 4 attached disks. This is the fourth, after
          # mysql, mongo and prometheus. Redis gave up its claim to free it.
          persistence:
            enabled: true
            storageClass: managed-csi
            size: 10Gi
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 1000m, memory: 1Gi }
        # Chart renders distributed roles alongside SingleBinary unless zeroed.
        read: { replicas: 0 }
        write: { replicas: 0 }
        backend: { replicas: 0 }
        chunksCache: { enabled: false }
        resultsCache: { enabled: false }
        gateway: { enabled: false }
        lokiCanary: { enabled: false }
        test: { enabled: false }
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
# Alloy, logs only. No prometheus.* components declared, so no overlap
# with the existing Prometheus scrape pipeline.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: iep-alloy
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: alloy
    targetRevision: 1.12.0
    helm:
      values: |
        controller:
          type: daemonset
        alloy:
          # Host /var/log, so loki.source.file reads this node's pod logs.
          mounts:
            varlog: true
          # Scopes discovery in the alloy-pods ConfigMap. HOSTNAME is the pod name.
          extraEnv:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          configMap:
            create: false
            name: alloy-pods
            key: config.alloy
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
# Events are cluster-scoped, so there is no per-node work to spread. A second
# replica would only duplicate them.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: iep-alloy-events
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: alloy
    targetRevision: 1.12.0
    helm:
      values: |
        controller:
          type: deployment
          replicas: 1
        alloy:
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { cpu: 200m, memory: 128Mi }
          configMap:
            create: false
            name: alloy-events
            key: config.alloy
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
