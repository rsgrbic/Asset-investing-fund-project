# The External Secrets Operator. Reads Azure Key Vault through workload identity
# and writes iep-secret and grafana-admin into the cluster. No credential is
# stored anywhere: the pod exchanges a projected token for an Azure one.
#
# Wave -3, ahead of the ClusterSecretStore and ExternalSecrets at wave -2 that
# need its CRDs.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: iep-external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 2.10.0
    helm:
      # ArgoCD uses the Application name as the Helm release name. That name
      # lands in spec.selector, which is immutable, so it must match the live
      # Deployments. fullnameOverride does not cover it: that fixes object
      # names, this fixes the app.kubernetes.io/instance label inside them.
      releaseName: external-secrets
      values: |
        # Belt and braces with releaseName above. Azure's federated credential
        # is bound to system:serviceaccount:external-secrets:external-secrets,
        # and a renamed ServiceAccount fails at token exchange, not at pod start.
        fullnameOverride: external-secrets
        installCRDs: true
        serviceAccount:
          annotations:
            azure.workload.identity/client-id: "093dd8f8-a016-435e-96e5-e7a6e03e4724"
        podLabels:
          azure.workload.identity/use: "true"
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      # Owns CRDs. Pruning one deletes every ExternalSecret with it.
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
