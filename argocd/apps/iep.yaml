# Pre-rendered manifests from the `deploy` branch, not the chart itself. CI runs
# `helm template` and commits the output there, so what ArgoCD applies is exactly
# what a diff of that branch shows, and no subchart is resolved at sync time.
# main stays the authoring surface and never receives a bot commit.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: iep
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/rsgrbic/Asset-investing-fund-project.git
    targetRevision: deploy
    # `path:` selects the scale profile. CI renders all three; swap this for
    # manifests/medium or manifests/large to scale up. PVCs cannot shrink, so
    # scaling back down needs the volumes deleted first.
    path: manifests/small
  destination:
    server: https://kubernetes.default.svc
    namespace: iep
  # MANUAL to start: you read `argocd app diff iep` before anything applies.
  # Switch to automated once the first sync is boring.
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
