# kube-prometheus-stack: Prometheus Operator + Prometheus + Alertmanager +
# Grafana + node-exporter + kube-state-metrics.
#
# sync-wave -1 puts this ahead of the iep Application, so the ServiceMonitor and
# PrometheusRule CRDs exist before the chart renders any. Same ordering problem
# cert-manager's CRDs already solved.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: iep-monitoring
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 88.5.0
    helm:
      values: |
        prometheus:
          prometheusSpec:
            # Both default to true, which restricts the operator to objects
            # carrying its own release label. Our ServiceMonitors come from the
            # iep chart and would be ignored with no error anywhere.
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
            # Both caps matter on a single node: whichever is hit first wins. 
            retention: 7d
            retentionSize: 8GB
            resources:
              requests: { cpu: 100m, memory: 1Gi }
              limits: { cpu: 1000m, memory: 2Gi }
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: managed-csi
                  accessModes: [ReadWriteOnce]
                  resources:
                    requests:
                      storage: 10Gi

        # AKS manages the control plane, so none of these are scrapeable. Left
        # enabled they become permanently-down targets and fire their default
        # alerts forever.
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeEtcd:
          enabled: false
        kubeProxy:
          enabled: false
        defaultRules:
          rules:
            kubeControllerManager: false
            kubeSchedulerAlerting: false
            kubeSchedulerRecording: false
            etcd: false
            kubeProxy: false

        alertmanager:
          alertmanagerSpec:
            resources:
              requests: { cpu: 10m, memory: 64Mi }
              limits: { cpu: 200m, memory: 256Mi }

        grafana:
          # Password comes from Key Vault via ESO — see cluster-config/eso-secrets.yaml.
          # This secret must exist before the pod starts or it stays in CreateContainerConfigError.
          admin:
            existingSecret: grafana-admin
            userKey: admin-user
            passwordKey: admin-password
          # Measured, not guessed: the container sat at 507Mi against a 512Mi
          # limit and was OOMKilled twice. Grafana 13 with ~33 provisioned
          # dashboards does not fit in 512Mi.
          resources:
            requests: { cpu: 10m, memory: 512Mi }
            limits: { cpu: 500m, memory: 1Gi }
          # Both sidecars ran with no limits at all. They sit at ~73Mi each and
          # only watch ConfigMaps, so 128Mi is generous. `sidecar.resources`
          # applies to every sidecar the chart creates.
          sidecar:
            resources:
              requests: { cpu: 5m, memory: 64Mi }
              limits: { cpu: 100m, memory: 128Mi }
          env:
            # Go's GC knows nothing about the cgroup limit, so by default it
            # grows the heap until the kernel kills the process. GOMEMLIMIT
            # makes it collect harder as it approaches this figure. Kept below
            # the limit above so the GC acts before the OOM killer does.
            GOMEMLIMIT: "900MiB"
          ingress:
            enabled: true
            ingressClassName: nginx
            annotations:
              # The ClusterIssuer is created by the iep chart at wave 0, i.e.
              # after this. cert-manager retries, so the cert appears a minute
              # late on a from-zero install rather than failing.
              cert-manager.io/cluster-issuer: letsencrypt
            hosts:
              - grafana.20.215.32.142.sslip.io
            tls:
              - secretName: grafana-tls
                hosts:
                  - grafana.20.215.32.142.sslip.io
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      # prune stays OFF for the add-ons. These charts own CRDs, and pruning a
      # CRD deletes every custom resource of that kind with it.
      prune: false
      selfHeal: true
    syncOptions:
      # The monitoring namespace does not exist yet. Without this the sync fails
      # before creating anything.
      - CreateNamespace=true
      # The Prometheus and Alertmanager CRDs exceed the annotation size limit
      # client-side apply uses to store last-applied config.
      - ServerSideApply=true
