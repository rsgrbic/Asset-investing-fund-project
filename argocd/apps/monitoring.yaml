# kube-prometheus-stack at wave -1 so its CRDs exist before iep renders
# ServiceMonitors and PrometheusRules.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: iep-monitoring
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 88.5.0
    helm:
      values: |
        prometheus:
          prometheusSpec:
            # Default true = only picks up objects with the operator's own
            # release label. Our monitors come from the iep chart, so false.
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
            # Whichever cap is hit first wins.
            retention: 7d
            retentionSize: 8GB
            resources:
              requests: { cpu: 100m, memory: 1Gi }
              limits: { cpu: 1000m, memory: 2Gi }
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: managed-csi
                  accessModes: [ReadWriteOnce]
                  resources:
                    requests:
                      storage: 10Gi

        # AKS-managed control plane; these targets are unreachable.
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeEtcd:
          enabled: false
        kubeProxy:
          enabled: false
        defaultRules:
          rules:
            kubeControllerManager: false
            kubeSchedulerAlerting: false
            kubeSchedulerRecording: false
            etcd: false
            kubeProxy: false

        alertmanager:
          alertmanagerSpec:
            resources:
              requests: { cpu: 10m, memory: 64Mi }
              limits: { cpu: 200m, memory: 256Mi }

        grafana:
          # From Key Vault via ESO; must exist before the pod starts.
          admin:
            existingSecret: grafana-admin
            userKey: admin-user
            passwordKey: admin-password
          # OOMKilled at 512Mi with ~33 dashboards provisioned.
          resources:
            requests: { cpu: 10m, memory: 512Mi }
            limits: { cpu: 500m, memory: 1Gi }
          # Applies to every sidecar the chart creates.
          sidecar:
            resources:
              requests: { cpu: 5m, memory: 64Mi }
              limits: { cpu: 100m, memory: 128Mi }
          env:
            # Below the memory limit so GC acts before the OOM killer.
            GOMEMLIMIT: "900MiB"
          # The stack only provisions its own Prometheus datasource.
          additionalDataSources:
            - name: Loki
              type: loki
              uid: loki
              access: proxy
              url: http://loki.monitoring.svc:3100
              jsonData:
                maxLines: 1000
          ingress:
            enabled: true
            ingressClassName: nginx
            annotations:
              # ClusterIssuer comes from iep at wave 0; cert-manager retries.
              cert-manager.io/cluster-issuer: letsencrypt
            hosts:
              - grafana.20.215.32.142.sslip.io
            tls:
              - secretName: grafana-tls
                hosts:
                  - grafana.20.215.32.142.sslip.io
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      # Pruning a CRD deletes every resource of that kind.
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # CRDs exceed the annotation size limit of client-side apply.
      - ServerSideApply=true
