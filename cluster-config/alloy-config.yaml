# Applied by hand, like argocd-podmonitor.yaml. Alloy mounts these, so they must
# exist before the iep-alloy Applications sync or the pods fail on a missing volume.
# ArgoCD does not manage them: a change here needs a re-apply and a pod restart.
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-pods
  namespace: monitoring
data:
  config.alloy: |
    // Discovery reads pod metadata only, never log content. The node filter
    // keeps each replica to the pods it has files for.
    discovery.kubernetes "pods" {
      role = "pod"
      selectors {
        role  = "pod"
        field = "spec.nodeName=" + sys.env("NODE_NAME")
      }
    }

    // Labels match Prometheus names so metrics and logs correlate.
    discovery.relabel "pods" {
      targets = discovery.kubernetes.pods.targets

      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app"]
        target_label  = "app"
      }
      // Resolves to /var/log/pods/<ns>_<pod>_<uid>/<container>/*.log
      rule {
        source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
        separator     = "/"
        target_label  = "__path__"
        replacement   = "/var/log/pods/*$1/*.log"
      }
    }

    local.file_match "pods" {
      path_targets = discovery.relabel.pods.output
    }

    loki.source.file "pods" {
      targets    = local.file_match.pods.targets
      forward_to = [loki.process.cri.receiver]
    }

    // Files hold raw CRI lines. Without stage.cri the timestamp and stream
    // prefix stay in the message and `| json` fails.
    loki.process "cri" {
      forward_to = [loki.write.default.receiver]

      stage.cri {}
    }

    // Shipped raw; parsed at query time with `| json`.
    loki.write "default" {
      endpoint {
        url = "http://loki.monitoring.svc:3100/loki/api/v1/push"
      }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-events
  namespace: monitoring
data:
  config.alloy: |
    // Events have ~1h TTL; without this they are lost.
    loki.source.kubernetes_events "events" {
      forward_to = [loki.write.default.receiver]
    }

    loki.write "default" {
      endpoint {
        url = "http://loki.monitoring.svc:3100/loki/api/v1/push"
      }
    }
