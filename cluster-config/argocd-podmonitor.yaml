# PodMonitor, not ServiceMonitor: this ArgoCD has no metrics Services.
# Pods expose named `metrics` ports; redis has none, so no exclusion needed.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: argocd
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: argocd
spec:
  selector:
    matchLabels:
      app.kubernetes.io/part-of: argocd
    matchExpressions:
      # dex declares a metrics port but never binds it; permanent TargetDown.
      - key: app.kubernetes.io/name
        operator: NotIn
        values:
          - argocd-dex-server
  namespaceSelector:
    matchNames:
      - argocd
  podMetricsEndpoints:
    - port: metrics
      interval: 30s
      scrapeTimeout: 10s
