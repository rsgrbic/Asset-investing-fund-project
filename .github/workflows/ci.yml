name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      # eth-typing>=5 breaks web3's pytest plugin; without the pin pytest cannot start.
      - name: Install service dependencies
        run: pip install pytest 'eth-typing<5' -r auth/requirements.txt -r director/requirements.txt

      - name: Run unit tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: pytest tests/unit -q

  images:
    needs: unit-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [auth, employee, director]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/iep-${{ matrix.service }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/iep-${{ matrix.service }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


  render-manifests-publish-chart:
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    concurrency:
      group: main-writeback
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: azure/setup-helm@v4

      - name: Register subchart repos
        run: |
          helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
          helm repo add jetstack https://charts.jetstack.io
          helm repo update

      - name: Resolve subcharts from Chart.lock
        run: helm dependency build ./helm/iep

      - name: Lint
        run: helm lint ./helm/iep

      - uses: helm/kind-action@v1

      # kind has no Prometheus Operator; without these CRDs the dry-run fails.
      - name: Install the Prometheus Operator CRDs
        run: |
          set -euo pipefail
          for crd in servicemonitors prometheusrules; do
            kubectl apply --server-side -f "https://raw.githubusercontent.com/prometheus-operator/prometheus-operator/v0.93.1/example/prometheus-operator-crd/monitoring.coreos.com_$crd.yaml"
          done

      # clusterIssuer emptied: cert-manager CRDs not installed here.
      - name: Validate every env config
        run: |
          set -euo pipefail
          kubectl create namespace iep
          for env in values.yaml values-hosted.yaml; do
            for scale in small medium large; do
              echo "checking $env + $scale"
              helm template iep ./helm/iep \
                -n iep \
                -f "helm/iep/$env" \
                -f "helm/iep/scale/$scale.yaml" \
                --set ingress.clusterIssuer="" \
                --set secrets.jwtSecretKey=ci \
                --set secrets.mysqlRootPassword=ci \
                --set secrets.sqlDatabaseUrl=ci \
                --set secrets.directorPassword=ci \
              | kubectl apply --dry-run=server -f - > /dev/null
            done
          done

      # Commit rendered output to `deploy`, the branch ArgoCD watches.
      # GITHUB_TOKEN commits do not trigger workflow runs, so no loop.
      - name: Check out the deploy branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/checkout@v4
        with:
          ref: deploy
          path: deploy-branch

      - name: Render manifests
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          for scale in small medium large; do
            mkdir -p "deploy-branch/manifests/$scale"
            helm template iep ./helm/iep \
              -n iep \
              -f helm/iep/values-hosted.yaml \
              -f "helm/iep/scale/$scale.yaml" \
              --set services.auth.image.tag=${{ github.sha }} \
              --set services.employee.image.tag=${{ github.sha }} \
              --set services.director.image.tag=${{ github.sha }} \
              > "deploy-branch/manifests/$scale/iep.yaml"
          done

      - name: Publish to the deploy branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: deploy-branch
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifests
          if git diff --cached --quiet; then
            echo "::notice::rendered output unchanged"
          else
            git commit -m "Render ${{ github.sha }}"
            git push
          fi

      # Only publishes when Chart.yaml version changes.
      - name: Did Chart.yaml change?
        id: chart_changed
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep -qx 'helm/iep/Chart.yaml'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Chart.yaml unchanged — skipping publish. Bump version: in Chart.yaml to release."
          fi

      - name: Package and push chart
        if: steps.chart_changed.outputs.changed == 'true'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
          helm package ./helm/iep -d dist
          helm push dist/*.tgz oci://ghcr.io/${{ github.repository_owner }}/charts
